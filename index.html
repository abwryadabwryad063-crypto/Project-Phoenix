<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Phoenix - تسجيل الدخول</title>
    <style>
        :root {
            --primary-orange: #FF8C00;
            --dark-bg: #1a1d24;
            --text-color: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://files.catbox.moe/t7k69a.jpg');
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .login-container {
            background: rgba(30, 35, 45, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 450px;
            z-index: 10;
            border: 1px solid #333;
        }

        .login-container h1 {
            color: var(--primary-orange);
            margin-bottom: 10px;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-container p {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-sizing: border-box;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-google { background-color: #db4437; }
        .btn-facebook { background-color: #3b5998; }
        .btn-phone { background-color: #f4b400; color: #333; }
        .btn-discord { background-color: #7289da; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-tiktok { background-color: #000000; border: 1px solid #333; }
        .btn-apple { background-color: #000000; border: 1px solid #333;}
        .btn-guest { background-color: #555; }

        .icon {
            width: 24px;
            height: 24px;
            margin-left: 10px;
            object-fit: contain;
        }

        .more-options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .btn-small {
            width: calc(25% - 10px);
            padding: 10px;
            font-size: 12px;
        }

        .btn-small .icon {
            width: 18px;
            height: 18px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="login-container">
        <h1>PROJECT PHOENIX</h1>
        <p>سجل دخولك وانطلق إلى أرض المعركة</p>

        <a href="#" class="btn btn-google">
            <img src="https://files.catbox.moe/5j1g0y.png" alt="Google" class="icon">
            تسجيل الدخول بواسطة Google
        </a>
        <a href="#" class="btn btn-facebook">
            <img src="https://files.catbox.moe/k4h62j.png" alt="Facebook" class="icon">
            تسجيل الدخول بواسطة Facebook
        </a>
        <a href="#" class="btn btn-phone">
            <img src="https://files.catbox.moe/j9m1y8.png" alt="Phone" class="icon">
            تسجيل برقم الهاتف/البريد
        </a>

        <div class="more-options-container">
            <a href="#" class="btn btn-small btn-discord">
                <img src="https://files.catbox.moe/9z8c21.png" alt="Discord" class="icon">
                Discord
            </a>
            <a href="#" class="btn btn-small btn-guest">
                <img src="https://files.catbox.moe/5b7y44.png" alt="Guest" class="icon">
                ضيف
            </a>
            <a href="#" class="btn btn-small btn-whatsapp">
                <img src="https://files.catbox.moe/7x8c11.png" alt="WhatsApp" class="icon">
                WhatsApp
            </a>
            <a href="#" class="btn btn-small btn-tiktok">
                <img src="https://files.catbox.moe/p2a33d.png" alt="TikTok" class="icon">
                TikTok
            </a>
            <a href="#" class="btn btn-small btn-apple">
                <img src="https://files.catbox.moe/6q4s21.png" alt="Apple" class="icon">
                Apple
            </a>
        </div>
    </div>
</body>
</html>
