<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Phoenix</title>
    <!-- استدعاء مكتبة الأيقونات الجاهزة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://files.catbox.moe/t7k69a.jpg');
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .login-container {
            background: rgba(20, 25, 35, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            border: 1px solid rgba(255, 140, 0, 0.4);
        }

        .login-container h1 {
            color: #FF8C00;
            margin-bottom: 5px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-container p {
            color: #b0b0b0;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-sizing: border-box;
            color: white;
        }

        .btn i {
            margin-left: 10px;
            font-size: 18px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-google { background-color: #db4437; }
        .btn-facebook { background-color: #3b5998; }
        .btn-phone { background-color: #f4b400; color: #333; }

        .more-options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-small {
            width: calc(33% - 8px);
            padding: 8px;
            font-size: 11px;
        }

        .btn-small i {
            margin-left: 5px;
            font-size: 14px;
        }

        .btn-discord { background-color: #7289da; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-guest { background-color: #555; }
        .btn-tiktok { background-color: #000; border: 1px solid #444; }
        .btn-apple { background-color: #000; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="login-container">
        <h1>PROJECT PHOENIX</h1>
        <p>سجل دخولك وانطلق إلى أرض المعركة</p>

        <a href="#" class="btn btn-google">
            <i class="fab fa-google"></i> تسجيل الدخول بواسطة Google
        </a>
        <a href="#" class="btn btn-facebook">
            <i class="fab fa-facebook-f"></i> تسجيل الدخول بواسطة Facebook
        </a>
        <a href="#" class="btn btn-phone">
            <i class="fas fa-phone-alt"></i> تسجيل برقم الهاتف/البريد
        </a>

        <div class="more-options-container">
            <a href="#" class="btn btn-small btn-discord"><i class="fab fa-discord"></i> Discord</a>
            <a href="#" class="btn btn-small btn-guest"><i class="fas fa-user"></i> ضيف</a>
            <a href="#" class="btn btn-small btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="#" class="btn btn-small btn-tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="#" class="btn btn-small btn-apple"><i class="fab fa-apple"></i> Apple</a>
        </div>
    </div>
</body>
</html>
