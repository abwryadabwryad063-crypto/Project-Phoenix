<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Phoenix - جاري التحميل</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://your-image-link.com/phoenix-loading.jpg'); /* رابط صورتك هنا */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* إضافة نص "جاري التحميل" اختياري */
        .loading-text {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #FF8C00;
            font-family: sans-serif;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,0,0,0.7);
        }
    </style>
    <!-- كود بسيط لتحويل المستخدم بعد 5 ثواني إلى واجهة اللعبة الحقيقية -->
    <meta http-equiv="refresh" content="5;url=game-lobby.html">
</head>
<body>
    <div class="loading-screen">
        <div class="loading-text">جاري التحميل إلى أرض المعركة...</div>
    </div>
</body>
</html>
